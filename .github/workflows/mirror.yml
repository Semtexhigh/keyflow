name: Mirror installers
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Pull latest Keyflow installers and publish here
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir dl && cd dl
          gh release download -R Semtexhigh/vault --pattern '*.dmg' --pattern '*.msi' --pattern '*.exe' --pattern '*.AppImage' --pattern '*.deb' --pattern '*.rpm'
          ls -la
          gh release create v1.0.0 -R Semtexhigh/keyflow -t "Keyflow v1.0.0" -n "Download the installer for your machine. macOS: open the .dmg, drag Keyflow to Applications. If macOS says the app is damaged (unsigned, Apple Silicon), run once in Terminal: xattr -dr com.apple.quarantine /Applications/Keyflow.app" *.dmg *.msi *.exe *.AppImage *.deb *.rpm
